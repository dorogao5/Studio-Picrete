services:
  studio-api:
    image: picrete-studio:${RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_REVISION: ${RELEASE_SHA:-unknown}
    network_mode: host
    # Private .env passes unprefixed ESSENTIAL_TOOLS_* through validated aliases.
    # Gateway URL after private-v2 deployment: http://172.30.80.2:8080.
    env_file: .env
    environment:
      LLM_MAX_OUTPUT_TOKENS_BY_MODEL: ${LLM_MAX_OUTPUT_TOKENS_BY_MODEL:-}
      LLM_SAMPLING_BY_MODEL: ${LLM_SAMPLING_BY_MODEL:-}
    volumes:
      - ./data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
