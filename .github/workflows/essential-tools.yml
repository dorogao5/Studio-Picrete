name: Verify essential tools gateway
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse private reference data in Git
        run: |
          if git ls-files --error-unmatch essential_skills/reference_db.csv >/dev/null 2>&1; then
            echo 'Private reference CSV must not be tracked'; exit 1
          fi
      - run: python -m pip install -r essential_skills/requirements.txt pytest==8.4.2
      - name: Gateway tests with public synthetic fixture only
        env:
          REFERENCE_DB_PATH: ${{ github.workspace }}/essential_skills/tests/reference_fixture.csv
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q essential_skills/tests
      - name: Build isolated gateway image
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t essential-tools:ci essential_skills
      - name: Validate opt-in compose and image privacy
        env:
          RELEASE_SHA: ${{ github.sha }}
          ESSENTIAL_TOOLS_GATEWAY_TOKEN: ci-fixture-only-not-a-production-token
        run: |
          docker compose -f docker-compose.essential-tools.yml config --quiet
          docker run --rm --network none --entrypoint python essential-tools:ci -c "from pathlib import Path; assert not Path('/app/reference_db.csv').exists()"
