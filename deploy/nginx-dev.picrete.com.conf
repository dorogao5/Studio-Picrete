server {
    listen 80;
    listen [::]:80;
    server_name dev.picrete.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://dev.picrete.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.picrete.com;

    # certbot --nginx -d dev.picrete.com заполнит пути к сертификатам
    ssl_certificate /etc/letsencrypt/live/dev.picrete.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.picrete.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/picrete-studio;
    index index.html;

    include /etc/nginx/snippets/picrete-security-headers.conf;

    # Lecture decks and exam compilations can be substantially larger than a
    # typical handout. Keep this aligned with STUDIO_KB_MAX_FILE_MB.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_set_header X-Request-Id $request_id;
        # LLM-сравнения и DataLab OCR работают долго
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /version {
        proxy_pass http://127.0.0.1:8100/version;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8100/healthz;
        include /etc/nginx/proxy_params;
    }

    location ^~ /assets/ {
        root /srv/picrete/shared/studio;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
        try_files $uri /index.html;
    }
}
