# Separate opt-in deployment; never started by the normal Studio compose command.
# Clients using host networking call http://127.0.0.1:8180.
# Use a private --env-file with RELEASE_SHA and ESSENTIAL_TOOLS_GATEWAY_TOKEN.
services:
  essential-tools:
    image: picrete-essential-tools:${RELEASE_SHA:?Exact Git release SHA required}
    build:
      context: ./essential_skills
      labels:
        org.opencontainers.image.revision: ${RELEASE_SHA:?Exact Git release SHA required}
        org.opencontainers.image.source: https://github.com/dorogao5/Studio-Picrete
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      ESSENTIAL_TOOLS_ENV: production
      ESSENTIAL_TOOLS_BIND: 0.0.0.0
      ESSENTIAL_TOOLS_GATEWAY_TOKEN: ${ESSENTIAL_TOOLS_GATEWAY_TOKEN:?Private bearer token required}
      REFERENCE_DB_PATH: /data/reference_db.csv
    volumes:
      - type: bind
        source: /srv/picrete/shared/essential_skills/reference_db.csv
        target: /data/reference_db.csv
        read_only: true
        bind:
          create_host_path: false
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    # Four bounded workers (512 MiB address space each) plus gateway headroom.
    # These are ceilings, not reservations; keep two of the host's four CPUs
    # available to the application. Contended computations may time out sooner.
    pids_limit: 32
    mem_limit: 2304m
    cpus: 2.0
    restart: unless-stopped
    networks: [tools-isolated]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  tools-isolated:
    internal: true
